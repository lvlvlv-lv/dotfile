# Change prefix
set -g prefix C-x

# Use Emacs keybindings in copy mode (this is the default unless overridden by EDITOR/VISUAL env variables)
set -g mode-keys emacs

# Enable mouse support (optional, but helpful for selection with the mouse)
set -g mouse on

# Bind 'M-w' (Alt-w) to copy to the system clipboard
# Replace 'xclip -selection clipboard -i' with 'pbcopy' (macOS) or 'wl-copy' (Wayland)
bind-key -T copy-mode M-w send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Bind 'C-w' (Ctrl-w) to copy to the system clipboard (optional, useful as an alternative)
bind-key -T copy-mode C-w send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# To paste from the system clipboard into a tmux session (e.g., in the command line)
# Replace 'xclip -o -selection clipboard' with 'pbpaste' or 'wl-paste'
bind-key ] run "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
